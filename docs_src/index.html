<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/@docisfy/theme-github">
  <title>OpenPrintTag</title>
</head>

<body>
  <div id="app">Loading, please wait...</div>

  <script>
    window.$docsify = {
      name: "OpenPrintTag",
      repo: "//github.com/prusa3d/OpenPrintTag",
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>

  <style>
    /* A few tweaks to make the page print nicely */
    @media print {

      .sidebar,
      .nav,
      .github-corner,
      .app-nav {
        display: none !important;
      }

      section.content {
        position: static !important;
        padding: 0 !important;
        width: 100% !important;
        left: 0 !important;
      }

      article {
        max-width: none !important;
      }

      main {
        width: auto !important;
      }

      pre,
      blockquote,
      code {
        white-space: pre-wrap !important;
        word-wrap: break-word !important;
      }
    }
  </style>
</body>

</html>
